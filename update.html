<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>جاري تحديث المنظومة...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fbf9f5; color: #516447; text-align: center; }
    .loader { border: 4px solid #d4e9c4; border-top: 4px solid #516447; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>جاري تنظيف الذاكرة المؤقتة وتحديث المنظومة...</h2>
  <script>
    async function clearCacheAndUnregister() {
      // 1. مسح جميع الكاشات
      if ('caches' in window) {
        try {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
        } catch (e) { console.error(e); }
      }
      // 2. إلغاء تسجيل Service Worker
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let reg of registrations) {
            await reg.unregister();
          }
        } catch (e) { console.error(e); }
      }
      // 3. إعادة التوجيه
      setTimeout(() => {
        window.location.replace("./index.html?updated=true");
      }, 1500);
    }
    clearCacheAndUnregister();
  </script>
</body>
</html>
